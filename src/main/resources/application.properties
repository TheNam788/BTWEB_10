# ========================================================
# Cấu hình Spring Boot JWT với Nimbus JOSE + JWT
# ========================================================

spring.application.name=jwt-nimbus-auth
server.port=8005


spring.datasource.url=jdbc:mysql://localhost:3306/jwt_nimbus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=sa
spring.datasource.password=123456aA@$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cấu hình JWT Nimbus (HS256 yêu cầu secret key tối thiểu 256-bit = 32 bytes)
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Thời gian sống của Token: 1 giờ = 3600000 ms
security.jwt.expiration-time=3600000
